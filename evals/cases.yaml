# Eval cases for AIDO Lead Copilot. Each case is one user turn against a fresh
# database with the seeded, fictional leads (rows logged by earlier cases are
# removed). Facts (tool calls, lead rows) are graded exactly; wording is graded
# by a cheaper model with the rubric, when --judge is on.
#
# Starter set from plan task 3: one case per tool. Task 4 grows it (duplicates,
# fill-in, missing and out-of-range scores, no BI for כבאי, refusals, must_pass).
#
# A case may carry `history` (earlier turns, stored as messages) and
# `setup_leads` (log_lead calls made before the turn).
# Grow this file from real chats: every surprise becomes a case.

- id: leads_by_stage
  input: "כמה לידים יש בכל שלב?"
  expect:
    tools_called: [leads_query]
    answer_contains_any: ["כבאי", "בנאי", "פקח"]
    no_lead_rows: true
  rubric: "Gives one number per stage (כבאי, בנאי, פקח), taken from the tool, and mentions leads without a diagnosis if the tool reports them."

- id: lookup_existing_business
  input: "האם יש לנו כבר את שקד בוטיק?"
  expect:
    tools_called: [lookup_business]
    answer_contains_any: ["כבאי"]
    no_lead_rows: true
  rubric: "Says yes, the business is already a lead, and gives its stage from the tool."

- id: log_new_lead_with_score
  input: "תרשום ליד חדש: אופק הדרכות, חינוך והדרכה, 14 עובדים, ציון כולל 41, כאב עיקרי: אין תוכנית עבודה שנתית."
  expect:
    tools_called: [log_lead]
    lead:
      name_contains: "אופק"
      record_status: logged
      total_score: 41
      stage: builder
  rubric: "Confirms the lead was logged, with stage בנאי from the tool, in one or two lines."

- id: stage_for_a_score
  input: "מה השלב של עסק עם ציון 33?"
  expect:
    tools_called: [calculate_stage]
    answer_contains_any: ["כבאי"]
    no_lead_rows: true
  rubric: "Says כבאי, and that 33 is the top of the כבאי range (20-33)."
